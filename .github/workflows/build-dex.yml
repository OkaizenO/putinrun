name: Build Dex APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Dex source
        shell: bash
        run: |
          cat dex-ci/chunk0 dex-ci/chunk1 dex-ci/chunk2 dex-ci/chunk3 dex-ci/chunk4 | tr -d '\n' | base64 -d > DexAndroid-v0.2-source.zip
          unzip -q DexAndroid-v0.2-source.zip
          test -f DexAndroid/settings.gradle.kts
          test -f DexAndroid/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: DexAndroid
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s DexAndroid/app/build/outputs/apk/debug/app-debug.apk
          ls -lh DexAndroid/app/build/outputs/apk/debug/app-debug.apk
          sha256sum DexAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Dex APK
        uses: actions/upload-artifact@v4
        with:
          name: Dex-v0.2-debug-apk
          path: DexAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
